<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Web Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" class="display" type="text" value="0" readonly inputmode="decimal">

    <section class="keypad" aria-label="Calculator buttons">
      <button type="button" class="key key-light">AC</button>
      <button type="button" class="key">00</button>
      <button type="button" class="key">%</button>
      <button type="button" class="key key-operator">&div;</button>

      <button type="button" class="key">7</button>
      <button type="button" class="key">8</button>
      <button type="button" class="key">9</button>
      <button type="button" class="key key-operator">&times;</button>

      <button type="button" class="key">4</button>
      <button type="button" class="key">5</button>
      <button type="button" class="key">6</button>
      <button type="button" class="key key-operator">&minus;</button>

      <button type="button" class="key">1</button>
      <button type="button" class="key">2</button>
      <button type="button" class="key">3</button>
      <button type="button" class="key key-operator">&plus;</button>

      <button type="button" class="key key-zero">0</button>
      <button type="button" class="key">.</button>
      <button type="button" class="key key-operator">=</button>
    </section>
  </main>
</body>
</html>
